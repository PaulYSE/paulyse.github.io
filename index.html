<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Entries DB — static viewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 1rem; max-width:900px; }
    input, select, button { font-size: 1rem; padding: .5rem; }
    .row { display:flex; gap:.5rem; margin-bottom:.5rem; align-items:center; }
    table { width:100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { text-align:left; padding:.25rem .5rem; border-bottom: 1px solid #eee; }
    pre { background:#f6f6f6; padding:.5rem; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Database viewer</h1>
  <p>Search the read-only database hosted on this page. Results fetched on-demand (sql.js-httpvfs).</p>

  <div class="row">
    <label for="mode">Search:</label>
    <select id="mode">
      <option value="name">Name (exact)</option>
      <option value="like">Name (like)</option>
      <option value="tag">Tag</option>
      <option value="all">All (LIMIT 50)</option>
    </select>
    <input id="q" placeholder="search term (e.g. sunflower)" style="flex:1" />
    <button id="run">Run</button>
  </div>

  <div id="status">Loading sqlite engine…</div>
  <div id="results"></div>

  <script type="module">
  import initSqlJs from "https://cdn.jsdelivr.net/npm/sql.js@1.10.2/dist/sql-wasm.js";
  import { createDbWorker } from "https://cdn.jsdelivr.net/npm/sql.js-httpvfs@0.8.12/dist/sqlite.worker.js";

  const DB_URL = "./database.sqlite";  // same folder as your HTML
  const status = document.getElementById("status");
  const output = document.getElementById("out");

  async function main() {
    status.textContent = "Loading SQLite WASM engine…";

    const worker = await createDbWorker(
      [
        {
          from: "inline",
          config: {
            serverMode: "full",
            url: DB_URL,
            requestChunkSize: 4096
          }
        }
      ],
      initSqlJs
    );

    status.textContent = "Database loaded — running test query…";

    const result = await worker.db.query("SELECT rowid, name_en, tag FROM entries LIMIT 5;");
    output.textContent = JSON.stringify(result, null, 2);

    status.textContent = "Success!";
  }

  main().catch(e => {
    status.textContent = "Error: " + e.message;
    console.error(e);
  });
  </script>

</body>
</html>
